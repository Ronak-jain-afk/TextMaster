<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Enhancer</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="font">Appearance</button>
            <button class="tab-btn" data-tab="translate">Translate</button>
        </div>

        <div class="tab-content active" id="font-tab">
            <div class="control-group">
                <div class="control-label-row">
                    <label>Font Family</label>
                </div>
                <select id="font-family">
                    <option value="system-ui, -apple-system, sans-serif">Default System</option>
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'OpenDyslexic', sans-serif">OpenDyslexic</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans</option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-label-row">
                    <label>Size</label>
                    <span id="font-size-value" class="value-display">16px</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="font-size" min="12" max="32" value="16">
                </div>
            </div>

            <div class="control-group">
                <div class="control-label-row">
                    <label>Letter Spacing</label>
                    <span id="letter-spacing-value" class="value-display">0px</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="letter-spacing" min="-2" max="5" value="0" step="0.1">
                </div>
            </div>

            <div class="control-group">
                <div class="control-label-row">
                    <label>Line Height</label>
                    <span id="line-height-value" class="value-display">1.5</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="line-height" min="1" max="3" value="1.5" step="0.1">
                </div>
            </div>

            <div class="toggle-row">
                <label>Dark Mode</label>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="button-row">
                <button id="reset-font">Reset</button>
                <button id="apply-font" class="primary">Apply</button>
            </div>
        </div>

        <div class="tab-content" id="translate-tab">
            <div class="control-group">
                <label>Target Language</label>
                <select id="target-language">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                </select>
            </div>
            
            <div class="result-area">
                <textarea id="translation-input" placeholder="Enter text or select on page..." readonly></textarea>
                <textarea id="translation-output" placeholder="Translation result..." readonly></textarea>
            </div>
            
            <button id="translate-btn" class="primary full-width">Translate</button>
            <div class="button-row">
                <button id="copy-translation">Copy</button>
                <button id="tts-btn">Speak</button>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
